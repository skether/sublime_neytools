[tool.ruff]
line-length = 300
indent-width = 4
exclude = ["**/__pycache__"]

[tool.ruff.lint]
preview = true
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "UP", # pyupgrade
    "ANN",
]
ignore = ["UP015"]

[tool.pyright]
include = ["*.py"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"
reportUnknownMemberType = false
